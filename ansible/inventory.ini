# Inventory for the ZKOO PoC, IPs match locals.tf in Terraform

[vpn]
# Public IP during bootstrap (terraform output vpn_public_ip); the VPN is not configured yet
vm-vpn-01 ansible_host=VPN_PUBLIC_IP ssh_sources="['YOUR_PUBLIC_IP/32', '192.168.13.4']"

[mgmt]
# Reached directly over the VPN from the admin pool
vm-mgmt-01 ansible_host=192.168.13.4 ssh_sources="['10.8.4.0/24']"

[proxy]
vm-proxy-01 ansible_host=192.168.1.4

[webservers]
vm-web-01 ansible_host=192.168.4.4
vm-web-02 ansible_host=192.168.4.5

[media]
vm-media-01 ansible_host=192.168.4.6

[sftp]
vm-ftp-01 ansible_host=192.168.4.7

[appserver]
vm-app-01 ansible_host=192.168.8.4

[fileserver]
vm-fs-01 ansible_host=192.168.8.5

[ids]
vm-ids-01 ansible_host=192.168.13.5

# Every VM except vpn and mgmt only accepts SSH from the jump host
[via_jumphost:children]
proxy
webservers
media
sftp
appserver
fileserver
ids

[via_jumphost:vars]
ansible_ssh_common_args='-o ProxyJump=azureadmin@192.168.13.4'

[all:vars]
ansible_user=azureadmin
ansible_python_interpreter=/usr/bin/python3
