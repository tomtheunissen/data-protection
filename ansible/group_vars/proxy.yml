---
# Pin these to a specific version tag once the setup is stable
proxy_waf_image: owasp/modsecurity-crs:nginx
proxy_stream_image: nginx:1.27-alpine

proxy_server_name: zkoo
# HTTPS port inside the WAF container; the host publishes it on 443
proxy_waf_container_port: 8443
# OWASP CRS paranoia level used for blocking (1 = fewest false positives)
proxy_blocking_paranoia: 1

# Path routing: / is the public company website, /portaal/ the internal patient portal
proxy_site_host: vm-web-02
proxy_portal_host: vm-web-01
proxy_portal_path: /portaal/

proxy_sftp_backend_port: 22
# Keep in sync with partner_ip_ranges in terraform/variables.tf
proxy_sftp_allowed_from:
  - 203.0.113.0/24
  - 84.84.226.81/32   # TEMP: Tom's IP for test P4, remove after testing

# Training videos (Jellyfin); the media play sets Jellyfin's Base URL to /media
# The media play runs before the proxy play and finishes the setup wizard, so nobody can claim the admin account
proxy_media_enabled: true
proxy_media_host: vm-media-01
proxy_media_path: /media/
proxy_media_port: 8096