---
# smbd only: no Avahi, WSDD2 or NetBIOS, so only port 445 is listening
# Pinned: a<alpine>-s<samba>-r<build>; check Docker Hub for newer tags when updating
fs_image: servercontainers/samba:smbd-only-a3.24.1-s4.23.8-r0

fs_share_name: zkoo-data
fs_data_root: /srv/samba

# Every VPN employee gets a share account; ids are fixed so file ownership survives a container rebuild
fs_users: "{{ vpn_employees }}"
fs_group: employees
fs_group_gid: 1500
fs_uid_base: 2001
