---
# DVWA is deliberately vulnerable: keep it off except during tests and the demo
web_dvwa_enabled: false

# Patient portal; also hosts the deliberately vulnerable test target (DVWA)
web_role: portal

# The patient portal is the only VM that mounts the medical files share (Azure Files over the private endpoint)
medical_storage_account: stzkoosensitive01
medical_share: medical-files
medical_mount_path: /mnt/medical-files
# Key Vault secret written by Terraform (keyvault.tf)
medical_storage_key_secret: storage-key-stzkoosensitive01

# Test target images; check the latest tags before pinning
dvwa_image: ghcr.io/digininja/dvwa:latest
dvwa_db_image: mariadb:10
# The database password is generated on the first run and kept in Key Vault (secret below), never in Git
dvwa_db_password_secret: dvwa-db-password