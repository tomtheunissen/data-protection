---
# Base configuration for every VM
- name: All host requirements
  hosts: all
  become: true

  vars:
    # Sources allowed to SSH in; defaults to the jump host, override per group/host in the inventory
    ssh_allowed_from: "{{ ssh_sources | default(['192.168.13.4']) }}"

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: System update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot after kernel or library updates
      ansible.builtin.reboot:
        reboot_timeout: 600
      # The control node cannot reboot itself mid-run; it picks up updates on its next restart
      when: reboot_required.stat.exists and ansible_connection != "local"

    - name: Timezone setup
      community.general.timezone:
        name: Europe/Amsterdam

    - name: Base packages install
      ansible.builtin.apt:
        name:
          - ufw
          - auditd
          - unattended-upgrades
        state: present

    - name: Unattended-upgrades setup
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    # chrony is preinstalled on Azure Ubuntu images and synced to the host PTP clock; only ensure it runs
    - name: Base services startup
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - chrony
        - auditd

    # SSH hardening

    - name: Team public keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('ansible.builtin.file', item) }}"
        state: present
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/ssh-keys/*.pub') }}"

    - name: SSH hardening config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          X11Forwarding no
          MaxAuthTries 3
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    # sshd -t needs this directory; on Ubuntu 24.04 it only exists once ssh has started via socket activation
    - name: Ensure sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Validate SSH config before restart
      ansible.builtin.command: sshd -t
      changed_when: false

    # Host firewall: order matters, SSH must be allowed before ufw is enabled

    - name: Allow SSH from management sources
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ssh_allowed_from }}"

    - name: Default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Default allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Enable ufw
      community.general.ufw:
        state: enabled


