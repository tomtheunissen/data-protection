---
# Base configuration for every VM
- name: All host requirements
  hosts: all
  become: true

  vars:
    # Sources allowed to SSH in; defaults to the jump host, override per group/host in the inventory
    ssh_allowed_from: "{{ ssh_sources | default(['192.168.13.4']) }}"

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: System update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot after kernel or library updates
      ansible.builtin.reboot:
        reboot_timeout: 600
      # The control node cannot reboot itself mid-run; it picks up updates on its next restart
      when: reboot_required.stat.exists and ansible_connection != "local"

    - name: Timezone setup
      community.general.timezone:
        name: Europe/Amsterdam

    - name: Base packages install
      ansible.builtin.apt:
        name:
          - ufw
          - auditd
          - unattended-upgrades
        state: present

    - name: Unattended-upgrades setup
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    # chrony is preinstalled on Azure Ubuntu images and synced to the host PTP clock; only ensure it runs
    - name: Base services startup
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - chrony
        - auditd

    # SSH hardening

    - name: Team public keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('ansible.builtin.file', item) }}"
        state: present
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/ssh-keys/*.pub') }}"

    - name: SSH hardening config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          X11Forwarding no
          MaxAuthTries 3
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    # sshd -t needs this directory; on Ubuntu 24.04 it only exists once ssh has started via socket activation
    - name: Ensure sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Validate SSH config before restart
      ansible.builtin.command: sshd -t
      changed_when: false

    # Host firewall: order matters, SSH must be allowed before ufw is enabled

    - name: Allow SSH from management sources
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ssh_allowed_from }}"

    - name: Default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Default allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Enable ufw
      community.general.ufw:
        state: enabled


# Docker runtime for the service VMs; VPN, jump host and IDS need host networking and SFTP uses the host sshd, so those stay native
- name: Container hosts
  hosts: proxy:webservers:media:appserver:fileserver
  become: true

  handlers:
    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

  tasks:
    - name: Container runtime install
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Container runtime service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # Published ports are DNATed in the FORWARD chain, so ufw's input rules never see them.
    # DOCKER-USER sends new inbound connections through the ufw route rules instead.
    - name: Make ufw filter traffic to containers
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} ZKOO DOCKER-USER"
        block: "{{ lookup('ansible.builtin.template', 'docker/ufw-docker.rules.j2') }}"
      notify: Reload ufw

    - name: Apply firewall changes before containers start
      ansible.builtin.meta: flush_handlers

    - name: Container project root
      ansible.builtin.file:
        path: /opt/zkoo
        state: directory
        owner: root
        group: root
        mode: "0755"


# snet-edge
- name: VPN server
  hosts: vpn
  become: true

  vars:
    vpn_users: "{{ (vpn_admins | map(attribute='name') | list) + vpn_employees }}"
    easyrsa_dir: /etc/openvpn/easy-rsa
    # Profiles are built on the jump host, uploaded to Key Vault and removed again
    vpn_profile_dir: /home/{{ ansible_user }}/.vpn-profiles

  handlers:
    - name: Restart openvpn
      ansible.builtin.service:
        name: openvpn-server@server
        state: restarted

    - name: Restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted

  tasks:
    # dnsmasq starts during install, so its config must exist first or it clashes with systemd-resolved on port 53
    - name: DNS forwarder config directory
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: DNS forwarder for VPN clients
      ansible.builtin.template:
        src: dnsmasq-vpn.conf.j2
        dest: /etc/dnsmasq.d/vpn.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart dnsmasq

    - name: VPN packages install
      ansible.builtin.apt:
        name:
          - openvpn
          - easy-rsa
          - oathtool
          - dnsmasq
        state: present

    # PKI: own CA, one server certificate and one client certificate per user

    - name: Easy-RSA working directory
      ansible.builtin.copy:
        src: /usr/share/easy-rsa/
        dest: "{{ easyrsa_dir }}/"
        remote_src: true
        mode: preserve

    - name: Initialise PKI
      ansible.builtin.command: ./easyrsa init-pki
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki"
      environment:
        EASYRSA_BATCH: "1"

    - name: Build certificate authority
      ansible.builtin.command: ./easyrsa build-ca nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/ca.crt"
      environment:
        EASYRSA_BATCH: "1"
        EASYRSA_REQ_CN: ZKOO-VPN-CA

    - name: Build server certificate
      ansible.builtin.command: ./easyrsa build-server-full server nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/issued/server.crt"
      environment:
        EASYRSA_BATCH: "1"

    - name: Build client certificates
      ansible.builtin.command: ./easyrsa build-client-full {{ item }} nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/issued/{{ item }}.crt"
      environment:
        EASYRSA_BATCH: "1"
      loop: "{{ vpn_users }}"

    - name: Generate certificate revocation list
      ansible.builtin.command: ./easyrsa gen-crl
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/crl.pem"
      environment:
        EASYRSA_BATCH: "1"

    # OpenVPN drops to nobody/nogroup, so files read per connection must be readable by that group
    - name: Publish revocation list
      ansible.builtin.copy:
        src: "{{ easyrsa_dir }}/pki/crl.pem"
        dest: /etc/openvpn/server/crl.pem
        remote_src: true
        owner: root
        group: nogroup
        mode: "0640"

    - name: Generate tls-crypt key
      ansible.builtin.command: openvpn --genkey secret /etc/openvpn/server/tls-crypt.key
      args:
        creates: /etc/openvpn/server/tls-crypt.key

    # Admins: fixed address in the admin pool and a TOTP secret

    - name: Client config directory
      ansible.builtin.file:
        path: /etc/openvpn/server/ccd
        state: directory
        owner: root
        group: nogroup
        mode: "0750"

    - name: Fixed admin addresses
      ansible.builtin.copy:
        dest: /etc/openvpn/server/ccd/{{ item.name }}
        content: "ifconfig-push {{ item.ip }} {{ vpn_netmask }}\n"
        owner: root
        group: nogroup
        mode: "0640"
      loop: "{{ vpn_admins }}"

    - name: TOTP secret directory
      ansible.builtin.file:
        path: /etc/openvpn/otp
        state: directory
        owner: root
        group: nogroup
        mode: "0750"

    - name: Generate TOTP secrets for admins
      ansible.builtin.shell: set -o pipefail && head -c 20 /dev/urandom | base32 | tr -d '=' > /etc/openvpn/otp/{{ item.name }}
      args:
        executable: /bin/bash
        creates: /etc/openvpn/otp/{{ item.name }}
      loop: "{{ vpn_admins }}"

    - name: TOTP secret permissions
      ansible.builtin.file:
        path: /etc/openvpn/otp/{{ item.name }}
        owner: root
        group: nogroup
        mode: "0640"
      loop: "{{ vpn_admins }}"

    - name: User verification script
      ansible.builtin.template:
        src: verify-user.sh.j2
        dest: /etc/openvpn/server/verify-user.sh
        owner: root
        group: nogroup
        mode: "0750"

    - name: OpenVPN server config
      ansible.builtin.template:
        src: server.conf.j2
        dest: /etc/openvpn/server/server.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart openvpn

    # Routing without NAT; Azure route table rt-vpn sends replies for the pools back to this VM

    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present

    - name: Allow OpenVPN
      community.general.ufw:
        rule: allow
        port: "{{ vpn_port }}"
        proto: udp

    - name: Allow DNS from VPN clients
      community.general.ufw:
        rule: allow
        interface: tun0
        direction: in
        port: "53"
        proto: any

    - name: Allow forwarding from VPN clients into the VNet
      community.general.ufw:
        rule: allow
        route: true
        interface_in: tun0
        interface_out: eth0

    - name: OpenVPN service
      ansible.builtin.service:
        name: openvpn-server@server
        state: started
        enabled: true

    - name: DNS forwarder service
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true

    # Client profiles: built on the jump host and stored in Key Vault, never left on disk

    - name: Read CA certificate
      ansible.builtin.slurp:
        src: "{{ easyrsa_dir }}/pki/ca.crt"
      register: vpn_ca_cert

    - name: Read tls-crypt key
      ansible.builtin.slurp:
        src: /etc/openvpn/server/tls-crypt.key
      register: vpn_tls_crypt_key
      no_log: true

    - name: Read client certificates
      ansible.builtin.slurp:
        src: "{{ easyrsa_dir }}/pki/issued/{{ item }}.crt"
      loop: "{{ vpn_users }}"
      register: vpn_client_certs

    - name: Read client keys
      ansible.builtin.slurp:
        src: "{{ easyrsa_dir }}/pki/private/{{ item }}.key"
      loop: "{{ vpn_users }}"
      register: vpn_client_keys
      no_log: true

    - name: Read admin TOTP secrets
      ansible.builtin.slurp:
        src: /etc/openvpn/otp/{{ item.name }}
      loop: "{{ vpn_admins }}"
      register: vpn_totp_secrets
      no_log: true

    - name: Temporary profile directory on the jump host
      ansible.builtin.file:
        path: "{{ vpn_profile_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Build client profiles
      ansible.builtin.template:
        src: client.ovpn.j2
        dest: "{{ vpn_profile_dir }}/{{ item }}.ovpn"
        mode: "0600"
      loop: "{{ vpn_users }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Log in to Azure with the jump host identity
      ansible.builtin.command: az login --identity --allow-no-subscriptions --output none
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Store client profiles in Key Vault
      ansible.builtin.command: >-
        az keyvault secret set --vault-name {{ key_vault_name }}
        --name vpn-profile-{{ item }} --file {{ vpn_profile_dir }}/{{ item }}.ovpn --output none
      loop: "{{ vpn_users }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Store admin TOTP secrets in Key Vault
      ansible.builtin.command: >-
        az keyvault secret set --vault-name {{ key_vault_name }}
        --name vpn-totp-{{ item.item.name }}
        --value otpauth://totp/ZKOO-VPN:{{ item.item.name }}?secret={{ item.content | b64decode | trim }}&issuer=ZKOO-VPN
        --output none
      loop: "{{ vpn_totp_secrets.results }}"
      delegate_to: localhost
      become: false
      changed_when: true
      no_log: true

    - name: Remove local profile copies
      ansible.builtin.file:
        path: "{{ vpn_profile_dir }}"
        state: absent
      delegate_to: localhost
      become: false

- name: Reverse proxy with WAF
  hosts: proxy
  become: true

  vars:
    proxy_dir: /opt/zkoo/proxy

  handlers:
    - name: Restart proxy containers
      community.docker.docker_compose_v2:
        project_src: "{{ proxy_dir }}"
        state: restarted

  tasks:
    - name: Proxy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ proxy_dir }}"
        - "{{ proxy_dir }}/certs"

    # Self-signed for the PoC; replace with a CA-signed certificate once a domain exists
    - name: Self-signed TLS certificate
      ansible.builtin.command: >-
        openssl req -x509 -newkey rsa:3072 -sha256 -days 365 -nodes
        -keyout {{ proxy_dir }}/certs/server.key
        -out {{ proxy_dir }}/certs/server.crt
        -subj "/CN={{ proxy_server_name }}"
      args:
        creates: "{{ proxy_dir }}/certs/server.crt"
      notify: Restart proxy containers

    # The WAF image runs as the unprivileged nginx user (uid 101)
    - name: Certificate ownership for the WAF container
      ansible.builtin.file:
        path: "{{ proxy_dir }}/certs/{{ item.name }}"
        owner: "101"
        group: "101"
        mode: "{{ item.mode }}"
      loop:
        - { name: server.crt, mode: "0644" }
        - { name: server.key, mode: "0600" }

    - name: Proxy configuration
      ansible.builtin.template:
        src: proxy/{{ item }}.j2
        dest: "{{ proxy_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - compose.yml
        - upstream.conf
        - default.conf.template
        - stream.conf
      notify: Restart proxy containers

    - name: Proxy containers
      community.docker.docker_compose_v2:
        project_src: "{{ proxy_dir }}"
        state: present
        pull: missing

    # DOCKER-USER sees the packet after Docker's DNAT, so the rule matches the container port, not 443
    - name: Allow HTTPS to the WAF
      community.general.ufw:
        rule: allow
        route: true
        proto: tcp
        to_port: "{{ proxy_waf_container_port }}"

    - name: Allow partner SFTP to the relay
      community.general.ufw:
        rule: allow
        route: true
        proto: tcp
        to_port: "2222"
        from_ip: "{{ item }}"
      loop: "{{ proxy_sftp_allowed_from }}"


# snet-frontend
- name: Web servers
  hosts: webservers
  become: true

  vars:
    web_dir: /opt/zkoo/web

  handlers:
    - name: Restart web containers
      community.docker.docker_compose_v2:
        project_src: "{{ web_dir }}"
        state: restarted

  tasks:
    - name: Web directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ web_dir }}"
        - "{{ web_dir }}/certs"
        - "{{ web_dir }}/html"

    # Proxy to backend traffic is re-encrypted; the proxy does not verify this certificate yet
    - name: Self-signed TLS certificate
      ansible.builtin.command: >-
        openssl req -x509 -newkey rsa:3072 -sha256 -days 365 -nodes
        -keyout {{ web_dir }}/certs/server.key
        -out {{ web_dir }}/certs/server.crt
        -subj "/CN={{ inventory_hostname }}"
      args:
        creates: "{{ web_dir }}/certs/server.crt"
      notify: Restart web containers

    - name: Private key permissions
      ansible.builtin.file:
        path: "{{ web_dir }}/certs/server.key"
        owner: root
        group: root
        mode: "0600"

    - name: Web server configuration
      ansible.builtin.template:
        src: web/{{ item.src }}
        dest: "{{ web_dir }}/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: compose.yml.j2, dest: compose.yml }
        - { src: default.conf.j2, dest: default.conf }
        - { src: index.html.j2, dest: html/index.html }
      notify: Restart web containers

    - name: Web containers
      community.docker.docker_compose_v2:
        project_src: "{{ web_dir }}"
        state: present
        pull: missing

    - name: Allow HTTPS from the reverse proxy only
      community.general.ufw:
        rule: allow
        route: true
        proto: tcp
        to_port: "443"
        from_ip: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['proxy'] }}"

- name: Media server
  hosts: media
  become: true
  tasks: []

# Native sshd: port 22 already serves management SSH, a Match block gives partners SFTP only
- name: SFTP server
  hosts: sftp
  become: true

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Partner group
      ansible.builtin.group:
        name: "{{ sftp_group }}"
        state: present

    # "*" means no usable password but not locked, so key login keeps working
    - name: Partner accounts
      ansible.builtin.user:
        name: "{{ item }}"
        group: "{{ sftp_group }}"
        home: "{{ sftp_root }}/{{ item }}"
        create_home: false
        shell: /usr/sbin/nologin
        password: "*"
        state: present
      loop: "{{ sftp_partners }}"

    # sshd refuses a chroot unless every directory in the path is owned by root and not writable by others
    - name: Chroot base directory
      ansible.builtin.file:
        path: "{{ sftp_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Partner chroot directories
      ansible.builtin.file:
        path: "{{ sftp_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ sftp_partners }}"

    - name: Partner upload directories
      ansible.builtin.file:
        path: "{{ sftp_root }}/{{ item }}/upload"
        state: directory
        owner: "{{ item }}"
        group: "{{ sftp_group }}"
        mode: "0750"
      loop: "{{ sftp_partners }}"

    - name: Partner key directory
      ansible.builtin.file:
        path: "{{ sftp_key_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Partner public keys
      ansible.builtin.copy:
        src: sftp-keys/{{ item }}.pub
        dest: "{{ sftp_key_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ sftp_partners }}"

    - name: SFTP restrictions for partners
      ansible.builtin.template:
        src: sftp/99-sftp-partners.conf.j2
        dest: /etc/ssh/sshd_config.d/99-sftp-partners.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    - name: Validate SSH config before restart
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Allow SFTP from the reverse proxy
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['proxy'] }}"


